appId: com.lekha.app
productName: Lekha
copyright: Copyright (c) 2026 Lekha

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# No native modules to unpack - Lekha has no .node binaries
# asarUnpack left empty intentionally

npmRebuild: false

# Conditional notarization (see build/notarize.cjs): notarizes only when Apple
# credentials are present in the environment, otherwise no-ops.
afterSign: build/notarize.cjs

# File associations: declare which document types Lekha can open so the OS shows
# it in "Open With" and routes double-clicked files to the app. On macOS this
# generates CFBundleDocumentTypes in Info.plist (delivered via the `open-file`
# event); on Windows it registers the extensions. role: Editor (we can edit, not
# just view). Extensions mirror the renderer's openable set (sidebarDrop.ts).
fileAssociations:
  - ext: md
    name: Markdown Document
    role: Editor
  - ext: markdown
    name: Markdown Document
    role: Editor
  - ext: mdx
    name: MDX Document
    role: Editor
  - ext: txt
    name: Plain Text Document
    role: Editor
  - ext: text
    name: Plain Text Document
    role: Editor

# Auto-update channel. electron-builder writes app-update.yml into the packaged
# app from this block; electron-updater reads it at runtime to locate releases.
# No actual GitHub release is required to wire the channel - publishing a real
# signed/notarized release is a later step.
publish:
  provider: github
  owner: mocarram
  repo: Lekha

# Publishing: signing/notarization is a future step.
# Set CSC_IDENTITY_AUTO_DISCOVERY=false for unsigned local builds.

mac:
  category: public.app-category.productivity
  # Signing is conditional: with no CSC_LINK env (and CSC_IDENTITY_AUTO_DISCOVERY
  # off for local builds) electron-builder skips signing and produces an unsigned
  # build; in CI, CSC_LINK + CSC_KEY_PASSWORD make it sign with the Developer ID.
  # hardenedRuntime + entitlements are required for notarization (ignored on
  # unsigned builds since no signing occurs).
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  # Custom app icon (build/icon.icns). Regenerate with:
  #   python3 scripts/make-icon.py && bash scripts/make-icon.sh
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  title: ${productName}
  artifactName: ${productName}-${version}-${arch}.dmg
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
