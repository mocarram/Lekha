name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      # Matches package.json engines (node >=22).
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Engines require npm >=11 and the lockfile is written by npm 11, which
      # omits optional platform packages that the runner-bundled npm 10 then
      # rejects in `npm ci` (lockfile "out of sync"). Align npm first.
      - name: Use npm 11 (matches engines + lockfile)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, unit tests
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build renderer + main
        run: npm run build

      # Publishes on a tag push; a manual workflow_dispatch run only builds
      # (dry run), so you can validate the pipeline without cutting a release.
      #
      # Signing is conditional on CSC_LINK. When it is set, electron-builder
      # signs (and notarize.cjs notarizes if the APPLE_* secrets exist). When
      # it is UNSET we must unset the empty CSC_* vars and disable identity
      # auto-discovery - otherwise electron-builder treats the empty CSC_LINK
      # as a certificate file path and fails ("... not a file"). This mirrors
      # `npm run dist:mac`, which builds unsigned the same way.
      - name: Package, (conditionally) sign + notarize, publish
        run: |
          PUBLISH=${{ github.event_name == 'push' && 'always' || 'never' }}
          if [ -n "$CSC_LINK" ]; then
            npx electron-builder --mac --publish "$PUBLISH"
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --publish "$PUBLISH"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set CSC_LINK + CSC_KEY_PASSWORD to flip to a signed build.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization (read by build/notarize.cjs): empty -> skipped.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
